<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍜 Хоолны цэс</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex flex-col justify center">
    <div class="p-3">
      <div>
        <h1 class="font-bold p-3">🍜 Хоолны цэс</h1>
      </div>
      <div class="flex gap-2 mb-4">
        <button
          class="border-1 border-black w-25 h-8 rounded-4xl bg-violet-200"
          onclick="searchFoodByType(`huurai`)"
        >
          1-р хоол
        </button>
        <button
          class="border-1 border-black w-25 h-8 rounded-4xl bg-violet-200"
          onclick="searchFoodByType(`shul`)"
        >
          2-р хоол
        </button>
        <button
          class="border-1 border-black w-25 h-8 rounded-4xl bg-violet-200"
          onclick="seeAllFoodList(`foods`)"
        >
          Бүх хоол
        </button>
      </div>
      <input
        id="searchInput"
        type="text"
        placeholder="Хоолны нэр хайх..."
        class="border border-1 w-85 h-8 rounded-4xl text-black p-2 bg-violet-200"
      />
      <button
        class="border border-1 w-20 h-8 rounded-4xl bg-violet-200"
        onclick="searchFood()"
      >
        Хайх
      </button>
    </div>

    <div class="p-3">
      <div id="foods"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
